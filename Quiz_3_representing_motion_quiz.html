<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Representing Motion Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F3EC;
    --panel: #FFFFFF;
    --panel-border: #E5E0D2;
    --text: #201E27;
    --text-secondary: #6E6A5C;
    --accent: #C97A1A;
    --accent-soft: #F1DEC0;
    --correct: #2E8B57;
    --correct-soft: #DCEEE1;
    --incorrect: #C1443B;
    --incorrect-soft: #F5DEDA;
    --bar-empty: #E5E0D2;
    --focus-ring: #6E6A5C;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141C;
      --panel: #1C2030;
      --panel-border: #2C3044;
      --text: #ECEDF2;
      --text-secondary: #9AA0B4;
      --accent: #F0AC3F;
      --accent-soft: #3A2E17;
      --correct: #6FCF97;
      --correct-soft: #1E3327;
      --incorrect: #FF8177;
      --incorrect-soft: #3A2020;
      --bar-empty: #2C3044;
      --focus-ring: #F0AC3F;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12141C;
    --panel: #1C2030;
    --panel-border: #2C3044;
    --text: #ECEDF2;
    --text-secondary: #9AA0B4;
    --accent: #F0AC3F;
    --accent-soft: #3A2E17;
    --correct: #6FCF97;
    --correct-soft: #1E3327;
    --incorrect: #FF8177;
    --incorrect-soft: #3A2020;
    --bar-empty: #2C3044;
    --focus-ring: #F0AC3F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
  }

  body {
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
    line-height: 1.5;
  }

  .app {
    width: 100%;
    max-width: 560px;
  }

  header.hero {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 28px;
  }

  .axis-icon {
    flex: none;
    position: relative;
    width: 64px;
    height: 64px;
  }

  .axis-line {
    position: absolute;
    top: 50%;
    left: 2px;
    right: 2px;
    height: 2px;
    background: var(--text-secondary);
    transform: translateY(-50%);
  }

  .axis-ticks {
    position: absolute;
    top: calc(50% + 3px);
    left: 2px;
    right: 2px;
    height: 8px;
    background-image: repeating-linear-gradient(to right, var(--text-secondary) 0, var(--text-secondary) 2px, transparent 2px, transparent 15px);
    opacity: 0.7;
  }

  .axis-dot {
    position: absolute;
    top: 50%;
    left: 2px;
    width: 12px;
    height: 12px;
    margin-top: -15px;
    border-radius: 50%;
    background: var(--accent);
    animation: glide 2.8s linear infinite alternate;
  }

  @keyframes glide {
    from { left: 2px; }
    to   { left: calc(100% - 14px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .axis-dot { animation: none; left: calc(50% - 6px); }
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-style: italic;
    font-size: 1.6rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 0;
    color: var(--text-secondary);
    font-size: 0.92rem;
    max-width: 36ch;
  }

  .bars {
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    gap: 4px;
    margin-bottom: 26px;
  }

  .bar {
    height: 24px;
    border-radius: 4px;
    background: var(--bar-empty);
    border: none;
    padding: 0;
    cursor: default;
    transition: background 0.25s ease, transform 0.15s ease;
  }

  .bar.visited { cursor: pointer; }
  .bar.visited:hover { transform: scaleY(1.12); }
  .bar.current { background: var(--accent); }
  .bar.correct { background: var(--correct); }
  .bar.incorrect { background: var(--incorrect); }
  .bar:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 28px 26px 24px;
  }

  .q-count {
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin: 0 0 10px;
  }

  .prompt {
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0 0 18px;
    line-height: 1.45;
  }

  .hint-toggle {
    background: none;
    border: none;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0 0 16px;
    cursor: pointer;
    display: block;
  }

  .hint-toggle:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }

  .hint-text {
    display: none;
    font-size: 0.88rem;
    color: var(--text-secondary);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 10px 12px;
    margin: -8px 0 16px;
  }

  .hint-text.shown { display: block; }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 6px;
  }

  .option {
    text-align: left;
    font-family: inherit;
    font-size: 0.96rem;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-left: 4px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .option:hover:not(:disabled) {
    border-left-color: var(--accent);
  }

  .option:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .option:disabled { cursor: default; }

  .option.chosen-correct {
    border-left-color: var(--correct);
    background: var(--correct-soft);
  }

  .option.chosen-incorrect {
    border-left-color: var(--incorrect);
    background: var(--incorrect-soft);
  }

  .option.reveal-correct {
    border-left-color: var(--correct);
  }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 0.92rem;
    display: none;
  }

  .feedback.shown { display: block; }
  .feedback.is-correct { background: var(--correct-soft); }
  .feedback.is-incorrect { background: var(--incorrect-soft); }

  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback.is-correct strong { color: var(--correct); }
  .feedback.is-incorrect strong { color: var(--incorrect); }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
  }

  .btn {
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--text);
  }

  .btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #241804;
  }

  .results {
    text-align: center;
  }

  .score-big {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 3.2rem;
    font-weight: 600;
    margin: 6px 0 4px;
  }

  .score-label {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin: 0 0 20px;
  }

  .score-msg {
    font-size: 1rem;
    margin: 0 0 24px;
  }

  .retake {
    margin: 0 auto;
    display: inline-block;
  }

  footer {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.78rem;
    margin-top: 28px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="axis-icon" aria-hidden="true">
      <div class="axis-line"></div>
      <div class="axis-ticks"></div>
      <div class="axis-dot"></div>
    </div>
    <div>
      <h1>Representing Motion</h1>
      <p class="subtitle">15 questions on motion diagrams, coordinate systems, vectors &amp; displacement.</p>
    </div>
  </header>

  <div class="bars" id="bars" role="tablist" aria-label="Question progress"></div>

  <main class="card" id="card"></main>

  <footer>Based on Module 2, Lessons 1–2 — Picturing Motion &amp; Where and When?</footer>
</div>

<script>
(function () {
  var QUESTIONS = [
    {
      id: "q1",
      prompt: "A camera stays fixed while taking a series of photos of a runner crossing its view. How can you tell the runner is in motion?",
      options: [
        { id: "a", text: "Her position changes relative to the background, which stays in the same place in every photo" },
        { id: "b", text: "The background shifts position from photo to photo while the runner stays put" },
        { id: "c", text: "The runner appears larger in each successive photo" },
        { id: "d", text: "The runner is blurry in every photo" }
      ],
      correct: "a",
      explanation: "Everything in the background stays in the same position in each image, while the runner appears in a different position each time. That tells you that, relative to the camera and the ground, only the runner is moving.",
      correctFeedback: "Exactly right.",
      incorrectFeedback: "Think about what stays fixed in each photo and what changes."
    },
    {
      id: "q2",
      prompt: "What is a motion diagram?",
      options: [
        { id: "a", text: "A series of images showing the positions of a moving object at equal time intervals" },
        { id: "b", text: "A graph of an object's speed against its mass" },
        { id: "c", text: "A single photograph showing where an object ends up" },
        { id: "d", text: "A diagram showing only the direction an object is moving" }
      ],
      correct: "a",
      explanation: "A motion diagram shows an object's position at equal time intervals — for example, by layering a runner's photos on top of each other.",
      correctFeedback: "That's the right definition.",
      incorrectFeedback: "The key idea is positions recorded at equal time intervals."
    },
    {
      id: "q3",
      prompt: "In a particle model of motion, what do you do with the moving object?",
      options: [
        { id: "a", text: "Replace it with a single point, ignoring details like moving arms and legs" },
        { id: "b", text: "Draw its full shape at every position" },
        { id: "c", text: "Replace it with a vector that points in its direction of travel" },
        { id: "d", text: "Divide it into many tiny pieces and track each one" }
      ],
      correct: "a",
      explanation: "In a particle model, you replace the object with a single point (such as the center of the runner's body). This works when the object's size is much less than the distance it moves.",
      correctFeedback: "Exactly — one point stands in for the whole object.",
      incorrectFeedback: "A particle model simplifies the object — think about how far it simplifies."
    },
    {
      id: "q4",
      prompt: "The dots on a particle model motion diagram are evenly spaced. What does this tell you about the object's motion?",
      options: [
        { id: "a", text: "It covers equal distances in equal time intervals, so its speed is not changing" },
        { id: "b", text: "It is speeding up" },
        { id: "c", text: "It is slowing down" },
        { id: "d", text: "It is not moving at all" }
      ],
      correct: "a",
      explanation: "Dots are recorded at equal time intervals, so equal spacing means equal distances in equal times — constant speed. If the spacing grew or shrank, the object would be speeding up or slowing down.",
      correctFeedback: "That's right — equal spacing means constant speed.",
      incorrectFeedback: "Remember that the time between dots is always the same."
    },
    {
      id: "q5",
      prompt: "What does a coordinate system tell you?",
      options: [
        { id: "a", text: "The location of the zero point (origin) and the direction in which the values increase" },
        { id: "b", text: "How fast an object is moving at each instant" },
        { id: "c", text: "The total distance an object has traveled" },
        { id: "d", text: "The mass of the object being studied" }
      ],
      correct: "a",
      explanation: "A coordinate system fixes the origin — the zero point of the variable you are studying — and the direction in which the values of that variable increase.",
      correctFeedback: "Exactly right.",
      incorrectFeedback: "Think about what you need to decide before you can say 'the runner is at 15 m'."
    },
    {
      id: "q6",
      prompt: "Which of the following is a vector quantity?",
      options: [
        { id: "a", text: "A displacement of 20 m to the right" },
        { id: "b", text: "A time interval of 4.0 s" },
        { id: "c", text: "A distance of 1.6 km" },
        { id: "d", text: "A temperature of 25 °C" }
      ],
      correct: "a",
      explanation: "A vector has both magnitude and direction. Displacement (20 m to the right) has both. Time, distance and temperature are scalars — just numbers with no direction.",
      correctFeedback: "That's correct.",
      incorrectFeedback: "Look for the choice that includes a direction."
    },
    {
      id: "q7",
      prompt: "A position of −5 m is described on a coordinate system where right is chosen as the positive direction. What does the negative sign mean?",
      options: [
        { id: "a", text: "The point is 5 m to the left of the origin" },
        { id: "b", text: "The point is 5 m to the right of the origin" },
        { id: "c", text: "The object is moving at 5 m/s" },
        { id: "d", text: "The object has traveled a negative distance" }
      ],
      correct: "a",
      explanation: "A negative position means the point lies on the opposite side of the origin from the positive direction. Since right is positive, −5 m is 5 m to the left of the origin.",
      correctFeedback: "Exactly right.",
      incorrectFeedback: "The sign tells you which side of the origin the point is on."
    },
    {
      id: "q8",
      prompt: "A runner passes the first marker at t = 2.5 s and the second marker at t = 7.0 s. What is the time interval between the two markers?",
      hint: "Δt = t_f − t_i",
      options: [
        { id: "a", text: "4.5 s" },
        { id: "b", text: "9.5 s" },
        { id: "c", text: "2.8 s" },
        { id: "d", text: "17.5 s" }
      ],
      correct: "a",
      explanation: "Δt = t_f − t_i = 7.0 s − 2.5 s = 4.5 s. Adding the two times (9.5 s) is a common slip, and the time interval is a scalar, so it has no direction.",
      correctFeedback: "Nicely calculated!",
      incorrectFeedback: "Remember the time interval is the final time minus the initial time."
    },
    {
      id: "q9",
      prompt: "A runner moves from an initial position of x_i = 8.0 m to a final position of x_f = 28.0 m (positive is to the right). What is her displacement?",
      hint: "Δx = x_f − x_i",
      options: [
        { id: "a", text: "+20.0 m (20.0 m to the right)" },
        { id: "b", text: "+36.0 m" },
        { id: "c", text: "−20.0 m" },
        { id: "d", text: "+3.5 m" }
      ],
      correct: "a",
      explanation: "Δx = x_f − x_i = 28.0 m − 8.0 m = +20.0 m. The positive sign means the displacement points in the positive direction, to the right.",
      correctFeedback: "That's the right displacement.",
      incorrectFeedback: "Displacement is final position minus initial position — not the sum."
    },
    {
      id: "q10",
      prompt: "What is the sum of a vector 12 m north and a vector 8 m north?",
      hint: "Vectors pointing the same way simply add their magnitudes.",
      options: [
        { id: "a", text: "20 m north" },
        { id: "b", text: "4 m north" },
        { id: "c", text: "96 m north" },
        { id: "d", text: "20 m south" }
      ],
      correct: "a",
      explanation: "When two vectors point in the same direction, the resultant has the combined magnitude in that same direction: 12 m + 8 m = 20 m north.",
      correctFeedback: "Correct.",
      incorrectFeedback: "Same direction means the magnitudes add."
    },
    {
      id: "q11",
      prompt: "A car moves along a straight road from x = 25 m to x = 10 m (positive is to the right). What is its displacement?",
      hint: "Δx = x_f − x_i — pay attention to the sign.",
      options: [
        { id: "a", text: "−15 m (15 m in the negative direction)" },
        { id: "b", text: "+15 m" },
        { id: "c", text: "−35 m" },
        { id: "d", text: "+35 m" }
      ],
      correct: "a",
      explanation: "Δx = x_f − x_i = 10 m − 25 m = −15 m. The negative sign shows the car moved in the negative direction, toward the origin.",
      correctFeedback: "That's the correct value and sign.",
      incorrectFeedback: "Subtract the initial position from the final one, keeping the sign."
    },
    {
      id: "q12",
      prompt: "Vector A is 4 km east and vector B is 6 km east. Using R = A − B, what is the resultant R? (East is positive.)",
      hint: "R = A − B = 4 km − 6 km",
      options: [
        { id: "a", text: "2 km west" },
        { id: "b", text: "10 km east" },
        { id: "c", text: "2 km east" },
        { id: "d", text: "24 km west" }
      ],
      correct: "a",
      explanation: "R = A − B = 4 km − 6 km = −2 km. With east positive, the negative sign means the resultant points west, so R = 2 km west.",
      correctFeedback: "Right — and the sign matters.",
      incorrectFeedback: "Subtract B from A, then interpret the sign using east as positive."
    },
    {
      id: "q13",
      prompt: "A jogger runs 30 m east, turns around, and then runs 10 m west. What are the total distance traveled and the displacement?",
      hint: "Distance is the whole length of the path; displacement is the change in position.",
      options: [
        { id: "a", text: "Distance 40 m; displacement 20 m east" },
        { id: "b", text: "Distance 20 m; displacement 40 m east" },
        { id: "c", text: "Distance 40 m; displacement 40 m east" },
        { id: "d", text: "Distance 20 m; displacement 20 m west" }
      ],
      correct: "a",
      explanation: "Distance is the entire length of the path: 30 m + 10 m = 40 m. Displacement is the change in position: 30 m east + 10 m west = 20 m east. Distance is a scalar; displacement is a vector.",
      correctFeedback: "Exactly — distance and displacement are different quantities.",
      incorrectFeedback: "Distance adds up every leg of the trip; displacement only compares start and end."
    },
    {
      id: "q14",
      prompt: "A tree is at x = +12 m. You redefine the coordinate system by moving the origin 5 m to the right (positive is still to the right). What is the tree's position in the new system?",
      hint: "Measure the tree's position from the new origin.",
      options: [
        { id: "a", text: "+7 m" },
        { id: "b", text: "+17 m" },
        { id: "c", text: "−7 m" },
        { id: "d", text: "+12 m" }
      ],
      correct: "a",
      explanation: "The new origin sits 5 m closer to the tree, so the tree is now 12 m − 5 m = 7 m to the right of the origin: +7 m. The tree didn't move — only the reference point did.",
      correctFeedback: "Nicely done.",
      incorrectFeedback: "Moving the origin toward the tree makes the tree's position smaller, not larger."
    },
    {
      id: "q15",
      prompt: "Vector A is 9 km east and vector B is 4 km west. With east as the positive direction, what is the resultant R = A − B?",
      hint: "Write B as a signed number first: 4 km west = −4 km.",
      options: [
        { id: "a", text: "13 km east" },
        { id: "b", text: "5 km east" },
        { id: "c", text: "13 km west" },
        { id: "d", text: "5 km west" }
      ],
      correct: "a",
      explanation: "With east positive, A = +9 km and B = −4 km. R = A − B = 9 km − (−4 km) = 13 km, which points east. Subtracting a vector that points west is the same as adding one that points east.",
      correctFeedback: "That's the correct resultant.",
      incorrectFeedback: "Careful with the double negative — subtracting a negative value adds."
    }
  ];

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var state = {
    idx: 0,
    answers: new Array(QUESTIONS.length).fill(null),
    visited: new Array(QUESTIONS.length).fill(false),
    optionOrder: new Array(QUESTIONS.length).fill(null),
    finished: false
  };

  var barsEl = document.getElementById('bars');
  var cardEl = document.getElementById('card');

  function score() {
    var s = 0;
    for (var i = 0; i < QUESTIONS.length; i++) {
      if (state.answers[i] === QUESTIONS[i].correct) s++;
    }
    return s;
  }

  function renderBars() {
    barsEl.innerHTML = '';
    QUESTIONS.forEach(function (q, i) {
      var b = document.createElement('button');
      b.className = 'bar';
      b.setAttribute('aria-label', 'Question ' + (i + 1));
      var answer = state.answers[i];
      if (answer !== null) {
        b.classList.add(answer === q.correct ? 'correct' : 'incorrect');
      } else if (i === state.idx && !state.finished) {
        b.classList.add('current');
      }
      if (state.visited[i]) {
        b.classList.add('visited');
        b.addEventListener('click', function () {
          state.finished = false;
          state.idx = i;
          render();
        });
      } else {
        b.disabled = true;
      }
      barsEl.appendChild(b);
    });
  }

  function renderQuestion() {
    var i = state.idx;
    var q = QUESTIONS[i];
    state.visited[i] = true;
    var answered = state.answers[i];

    if (!state.optionOrder[i]) {
      state.optionOrder[i] = shuffleArray(q.options);
    }
    var displayOptions = state.optionOrder[i];

    var html = '';
    html += '<p class="q-count">Question ' + (i + 1) + ' of ' + QUESTIONS.length + '</p>';
    html += '<p class="prompt">' + q.prompt + '</p>';

    if (q.hint) {
      html += '<button class="hint-toggle" id="hintBtn" type="button">Need a hint?</button>';
      html += '<div class="hint-text" id="hintText">' + q.hint + '</div>';
    }

    html += '<div class="options" id="optionsWrap">';
    displayOptions.forEach(function (opt) {
      var cls = 'option';
      if (answered) {
        if (opt.id === q.correct) cls += ' reveal-correct';
        if (opt.id === answered && answered !== q.correct) cls += ' chosen-incorrect';
        if (opt.id === answered && answered === q.correct) cls += ' chosen-correct';
      }
      html += '<button class="' + cls + '" data-opt="' + opt.id + '" ' + (answered ? 'disabled' : '') + '>' + opt.text + '</button>';
    });
    html += '</div>';

    var fbClass = 'feedback';
    var fbContent = '';
    if (answered) {
      var isCorrect = answered === q.correct;
      fbClass += isCorrect ? ' is-correct shown' : ' is-incorrect shown';
      fbContent = '<strong>' + (isCorrect ? q.correctFeedback : q.incorrectFeedback) + '</strong>' + q.explanation;
    }
    html += '<div class="' + fbClass + '" id="feedback">' + fbContent + '</div>';

    html += '<div class="nav-row">';
    html += '<button class="btn" id="backBtn" ' + (i === 0 ? 'disabled' : '') + '>Back</button>';
    var isLast = i === QUESTIONS.length - 1;
    html += '<button class="btn primary" id="nextBtn" ' + (answered ? '' : 'disabled') + '>' + (isLast ? 'See results' : 'Next') + '</button>';
    html += '</div>';

    cardEl.innerHTML = html;

    if (q.hint) {
      document.getElementById('hintBtn').addEventListener('click', function () {
        document.getElementById('hintText').classList.toggle('shown');
      });
    }

    document.querySelectorAll('#optionsWrap .option').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (state.answers[i] !== null) return;
        state.answers[i] = btn.getAttribute('data-opt');
        render();
      });
    });

    document.getElementById('backBtn').addEventListener('click', function () {
      state.idx = Math.max(0, i - 1);
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', function () {
      if (isLast) {
        state.finished = true;
        render();
      } else {
        state.idx = i + 1;
        render();
      }
    });
  }

  function renderResults() {
    var s = score();
    var total = QUESTIONS.length;
    var msg;
    if (s === total) {
      msg = "Perfect score — motion diagrams, coordinates and vectors are all locked in.";
    } else if (s >= total * 0.7) {
      msg = "Solid work — review the ones you missed and it'll stick.";
    } else if (s >= total * 0.4) {
      msg = "Good start — worth another pass through displacement and vector subtraction.";
    } else {
      msg = "Worth re-reading both lessons before trying again — the sign conventions take practice.";
    }

    var html = '<div class="results">';
    html += '<p class="score-label">Your score</p>';
    html += '<p class="score-big">' + s + ' / ' + total + '</p>';
    html += '<p class="score-msg">' + msg + '</p>';
    html += '<button class="btn primary retake" id="retakeBtn">Retake quiz</button>';
    html += '</div>';
    cardEl.innerHTML = html;

    document.getElementById('retakeBtn').addEventListener('click', function () {
      state = {
        idx: 0,
        answers: new Array(QUESTIONS.length).fill(null),
        visited: new Array(QUESTIONS.length).fill(false),
        optionOrder: new Array(QUESTIONS.length).fill(null),
        finished: false
      };
      render();
    });
  }

  function render() {
    renderBars();
    if (state.finished) {
      renderResults();
    } else {
      renderQuestion();
    }
  }

  render();
})();
</script>
</body>
</html>
